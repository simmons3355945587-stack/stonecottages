server {
    listen 80;
    listen [::]:80;
    server_name ourstonecottages.org www.ourstonecottages.org 104.225.144.247;
    root /var/www/vocab;
    index index.html;
    server_tokens off;
    client_max_body_size 100M;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. 现有主 API 网关
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # 2. 多人对战 WebSocket 专线代理
    
    # 1.1 PK AI Endpoints to 8088
    location = /api/verify_clue {
        proxy_pass http://127.0.0.1:8088/api/verify_clue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ai_status {
        proxy_pass http://127.0.0.1:8088/api/ai_status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/set_gemini_key {
        proxy_pass http://127.0.0.1:8088/api/set_gemini_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8088/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. 对战专属静态/动态后缀路由
    location ~* \.battle$ {
        root /var/www/vocab;
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location = /.battle {
        root /var/www/vocab;
        try_files /tri-match.battle =404;
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location = /pk {
        root /var/www/vocab;
        try_files /tri-match.battle =404;
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location = /battle {
        root /var/www/vocab;
        try_files /tri-match.battle =404;
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ^~ /backend/ { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
    location ~* \.mp3$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    location = /beta {
        alias /var/www/vocab/canton-listening.beta.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /.beta {
        alias /var/www/vocab/canton-listening.beta.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /canton-listening.beta {
        alias /var/www/vocab/canton-listening.beta.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}
