<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小石屋 · 道友灵</title>
<style>
/* =========================================================
   折纸美学设计系统 (Origami & Papercraft Design Tokens)
   ========================================================= */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --font-serif: "Cinzel", "Songti SC", "SimSun", "Noto Serif SC", serif;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ☀️ 和纸羊皮纸折纸 (Washi & Kraft Papercraft) */
[data-theme="light"] {
  --bg-main: #f5efe6;
  --bg-pattern: radial-gradient(circle at 10% 10%, rgba(217, 119, 6, 0.06) 0%, transparent 40%),
                 radial-gradient(circle at 90% 90%, rgba(79, 70, 229, 0.05) 0%, transparent 40%),
                 linear-gradient(180deg, #f7f2ea 0%, #ebe2d3 100%);
  --paper-surface: #fdfbf7;
  --paper-surface-sub: #f0e8dc;
  --paper-hover: #e8ded0;
  --paper-border: #d6c8b4;
  --paper-shadow: 3px 4px 0px #b8a68f, 0 8px 20px rgba(160, 140, 110, 0.15);
  --paper-shadow-sm: 2px 2px 0px #b8a68f;
  --paper-shadow-active: 1px 1px 0px #b8a68f;

  --text-primary: #2d261e;
  --text-secondary: #6e6254;
  --text-tertiary: #9c8e7e;

  --brand-primary: #4338ca;
  --brand-primary-light: #4f46e5;
  --brand-accent: #d97706;
  --nav-bg: rgba(245, 239, 230, 0.96);
}

/* 🌙 曜黑暗夜折纸 (Midnight Origami) */
[data-theme="dark"] {
  --bg-main: #0c1017;
  --bg-pattern: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                 radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.05) 0%, transparent 40%),
                 linear-gradient(180deg, #090d13 0%, #111722 100%);
  --paper-surface: #161c28;
  --paper-surface-sub: #1e2636;
  --paper-hover: #263044;
  --paper-border: #2a364d;
  --paper-shadow: 3px 4px 0px #06090d, 0 10px 25px rgba(0, 0, 0, 0.5);
  --paper-shadow-sm: 2px 2px 0px #06090d;
  --paper-shadow-active: 1px 1px 0px #06090d;

  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-tertiary: #64748b;

  --brand-primary: #6366f1;
  --brand-primary-light: #818cf8;
  --brand-accent: #f59e0b;
  --nav-bg: rgba(12, 16, 23, 0.96);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* 关键修复：防止手机端 100vh 溢出导致输入框滚到屏幕下方 */
html, body {
  height: 100%;
  height: 100dvh;
  width: 100%;
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--bg-main);
  background-image: var(--bg-pattern);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
}

/* 顶部导航 */
header {
  background: var(--nav-bg);
  border-bottom: 2px solid var(--paper-border);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  z-index: 10;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-home {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--paper-surface);
  border: 1px solid var(--paper-border);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--paper-shadow-sm);
}

.title-badge {
  display: flex;
  align-items: center;
  gap: 6px;
}
.title-text {
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-serif);
  color: var(--text-primary);
}
.status-pill {
  background: rgba(217, 119, 6, 0.12);
  color: var(--brand-accent);
  border: 1px solid var(--brand-accent);
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}

.theme-toggle {
  background: var(--paper-surface);
  border: 1px solid var(--paper-border);
  color: var(--text-secondary);
  padding: 5px 9px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  box-shadow: var(--paper-shadow-sm);
}

/* 主内容容器：自适应撑满剩余高度 */
main {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  padding: 8px 12px;
  overflow: hidden;
}

.origami-cottage-card {
  width: 100%;
  max-width: 860px;
  height: 100%;
  background: var(--paper-surface);
  border: 2px solid var(--paper-border);
  border-radius: var(--radius-md);
  box-shadow: var(--paper-shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* 顶部状态条 */
.card-banner {
  padding: 8px 14px;
  background: var(--paper-surface-sub);
  border-bottom: 1px solid var(--paper-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.pills-group { display: flex; gap: 6px; }
.mini-pill {
  padding: 2px 7px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
}
.pill-gold { background: rgba(217, 119, 6, 0.12); color: var(--brand-accent); }
.pill-blue { background: rgba(67, 56, 202, 0.1); color: var(--brand-primary); }

/* 对话滚屏区域：必须 min-height: 0 保证内部独立滚动 */
.chat-window {
  flex: 1;
  min-height: 0;
  padding: 14px 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.chat-bubble-row {
  display: flex;
  flex-direction: column;
  max-width: 88%;
}
.chat-bubble-row.user { align-self: flex-end; }
.chat-bubble-row.assistant { align-self: flex-start; }

.bubble-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 3px;
}
.chat-bubble-row.user .bubble-meta { text-align: right; }

.bubble-content {
  padding: 10px 14px;
  border-radius: var(--radius-md);
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.chat-bubble-row.user .bubble-content {
  background: var(--brand-primary);
  color: #ffffff;
  border: 1px solid var(--brand-primary-light);
  border-bottom-right-radius: 3px;
  box-shadow: 2px 2px 0px rgba(0,0,0,0.12);
}

.chat-bubble-row.assistant .bubble-content {
  background: var(--paper-surface);
  color: var(--text-primary);
  border: 1px solid var(--paper-border);
  border-bottom-left-radius: 3px;
  box-shadow: var(--paper-shadow-sm);
}

/* 快捷场景条 */
.quick-prompts-bar {
  padding: 6px 12px;
  background: var(--paper-surface-sub);
  border-top: 1px solid var(--paper-border);
  display: flex;
  gap: 6px;
  overflow-x: auto;
  white-space: nowrap;
  flex-shrink: 0;
}
.quick-prompts-bar::-webkit-scrollbar { display: none; }

.origami-btn {
  background: var(--paper-surface);
  border: 1px solid var(--paper-border);
  color: var(--text-secondary);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  cursor: pointer;
  box-shadow: var(--paper-shadow-sm);
  flex-shrink: 0;
}

/* 底部输入框：永久置底防遮挡 */
.input-dock {
  padding: 10px 14px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--paper-surface);
  border-top: 1.5px solid var(--paper-border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.origami-input {
  flex: 1;
  background: var(--paper-surface-sub);
  border: 1.5px solid var(--paper-border);
  color: var(--text-primary);
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
}
.origami-input:focus {
  border-color: var(--brand-accent);
  background: var(--paper-surface);
}

.send-action-btn {
  background: var(--brand-accent);
  color: #ffffff;
  border: none;
  padding: 0 16px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--paper-shadow-sm);
}
.send-action-btn:disabled {
  opacity: 0.6;
}

/* =========================================================
   📔 偷看日记抽屉模态 (Origami Journal Drawer)
   ========================================================= */
.diary-modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.48);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}
.diary-sheet {
  max-width: 580px;
  width: 100%;
  max-height: 86vh;
  background: var(--paper-surface);
  border: 2px solid var(--paper-border);
  border-radius: var(--radius-md);
  box-shadow: var(--paper-shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: diaryPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes diaryPop {
  0% { opacity: 0; transform: scale(0.96) translateY(8px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.diary-header {
  padding: 12px 16px;
  background: var(--paper-surface-sub);
  border-bottom: 1.5px solid var(--paper-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.diary-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.diary-card {
  background: var(--paper-surface-sub);
  border: 1px solid var(--paper-border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  box-shadow: var(--paper-shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
}
.diary-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.diary-date {
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 700;
  color: var(--brand-accent);
}
.diary-tag {
  background: rgba(217, 119, 6, 0.12);
  color: var(--brand-accent);
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
}
.diary-content {
  font-size: 13.5px;
  line-height: 1.68;
  color: var(--text-primary);
  white-space: pre-wrap;
}
.diary-footer {
  padding: 10px 16px;
  background: var(--paper-surface);
  border-top: 1px solid var(--paper-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
</style>
</head>
<body>

<header>
  <div class="brand-group">
    <a href="/" class="back-home">🏰 小石屋</a>
    <div class="title-badge">
      <span class="title-text">道友 · 灵</span>
      <span class="status-pill">随时在侧</span>
    </div>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <button class="origami-btn" onclick="openPromptEditor()" style="background:var(--paper-surface); font-weight:600; color:var(--text-main); border-color:var(--paper-crease);" title="查看并直接修改底层人设">⚙️ 人设底座</button>
    <button class="origami-btn" onclick="openDiary()" style="background:var(--paper-surface); font-weight:600; color:var(--brand-accent); border-color:var(--brand-accent);">📔 偷看日记</button>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换折纸日夜主题">🌓</button>
  </div>
</header>

<main>
  <div class="origami-cottage-card">
    <div class="card-banner">
      <div class="pills-group">
        <span class="mini-pill pill-gold">骨相: 修远之骨</span>
        <span class="mini-pill pill-blue">血肉: 核聚之真</span>
      </div>
      <span style="color:var(--text-tertiary); font-size:11px;">实事求是 · 平视相交</span>
    </div>

    <div id="chatWindow" class="chat-window">
      <div class="chat-bubble-row assistant">
        <div class="bubble-meta">灵 · 刚刚</div>
        <div class="bubble-content">允安，我在。今天怎么着，是坐这儿喝两口茶闲聊，还是有啥硬骨头要拆？</div>
      </div>
    </div>

    <div class="quick-prompts-bar">
      <button class="origami-btn" onclick="quickSend('今天外面阴天下雨，整个人有点提不起劲，坐在窗边喝茶发呆')">🍵 90% 阴天下雨喝茶</button>
      <button class="origami-btn" onclick="quickSend('还记得修远天台布道不？')">📖 聊剧情: 修远天台</button>
      <button class="origami-btn" onclick="quickSend('今天算力板块莫名其妙暴跌，持仓回撤不少，看着心里挺膈应')">📉 90% 科技盘面异动</button>
      <button class="origami-btn" onclick="quickSend('我最近看这份复杂材料，翻来覆去几天还是一团乱麻，卡在核心指标上了')">💥 10% 遭遇卡点内耗</button>
    </div>

    <div class="input-dock">
      <input type="text" id="chatInput" class="origami-input" placeholder="输入想聊的事（生活琐事、原著剧情、思维卡点）..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-action-btn" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</main>

<!-- ⚙️ 人设底座配置模态 (Origami Prompt Editor Modal) -->
<div id="promptModal" class="diary-modal" style="display:none;" onclick="if(event.target===this) closePromptEditor()">
  <div class="diary-sheet" style="max-width: 680px; height: 86vh;">
    <div class="diary-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:22px;">⚙️</span>
        <div>
          <div style="font-family:var(--font-serif); font-weight:700; font-size:16px; color:var(--text-primary);">灵的底层人设与认知底座</div>
          <div style="font-size:11px; color:var(--text-tertiary);">在线直接修改 · 即刻生效 · 剧情索引已完全解耦外挂</div>
        </div>
      </div>
      <button class="origami-btn" onclick="closePromptEditor()" style="font-size:12px; padding:3px 10px;">✕ 阖上</button>
    </div>

    <!-- 状态指示条 -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 16px; background:var(--paper-surface-sub); border-bottom:1px solid var(--paper-border); flex-shrink:0;">
      <span id="promptStatusBadge" style="font-size:12px; color:var(--text-secondary); font-family:var(--font-mono);">
        状态: <span style="color:var(--pine-green); font-weight:600;">默认精炼底座</span>
      </span>
      <span style="font-size:11px; color:var(--text-tertiary);">（支持在此微调口吻与禁令，修改后点右下角保存）</span>
    </div>

    <!-- 文本编辑区域 -->
    <div style="flex:1; padding:12px 16px; display:flex; flex-direction:column; overflow:hidden;">
      <textarea id="promptEditorInput" style="flex:1; width:100%; resize:none; padding:12px; font-family:var(--font-mono); font-size:13px; line-height:1.6; border:1px solid var(--paper-border); border-radius:var(--radius-sm); background:var(--paper-surface); color:var(--text-primary); outline:none; box-sizing:border-box;"></textarea>
    </div>

    <!-- 底部按钮栏 -->
    <div style="padding:10px 16px; border-top:1px solid var(--paper-border); background:var(--paper-surface-sub); display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
      <button class="origami-btn" onclick="resetPrompt()" style="font-size:12px; color:#c0392b; border-color:#e74c3c;">🔄 恢复默认底座</button>
      <div style="display:flex; gap:8px;">
        <button class="origami-btn" onclick="closePromptEditor()" style="font-size:12px;">取消</button>
        <button class="send-action-btn" id="savePromptBtn" onclick="savePrompt()" style="padding:6px 16px; font-size:12px; border-radius:var(--radius-sm);">💾 保存底座修改</button>
      </div>
    </div>
  </div>
</div>

<!-- 📔 偷看日记抽屉模态 (Origami Journal Drawer) -->
<div id="diaryModal" class="diary-modal" style="display:none;" onclick="if(event.target===this) closeDiary()">
  <div class="diary-sheet">
    <div class="diary-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:22px;">📔</span>
        <div>
          <div style="font-family:var(--font-serif); font-weight:700; font-size:16px; color:var(--text-primary);">灵的私房手记与心智底座</div>
          <div style="font-size:11px; color:var(--text-tertiary);">高纯度结构化沉淀 · 严禁日常流水账垃圾</div>
        </div>
      </div>
      <button class="origami-btn" onclick="closeDiary()" style="font-size:12px; padding:3px 10px;">✕ 阖上</button>
    </div>

    <!-- 顶部标签栏 -->
    <div style="display:flex; gap:6px; padding:8px 16px; background:var(--paper-surface-sub); border-bottom:1px solid var(--paper-border); flex-shrink:0;">
      <button class="origami-btn tab-btn active" id="tabJournalBtn" onclick="switchDiaryTab('journal')">📔 破局札记</button>
      <button class="origami-btn tab-btn" id="tabFactsBtn" onclick="switchDiaryTab('facts')">🧠 长期事实认知</button>
      <button class="origami-btn tab-btn" id="tabFollowBtn" onclick="switchDiaryTab('followup')">⏳ 挂念待办</button>
    </div>
    
    <div class="diary-body" id="diaryBody">
      <div style="text-align:center; padding:24px; color:var(--text-tertiary); font-size:12px;">正在翻阅手记与认知底座...</div>
    </div>
    
    <div class="diary-footer">
      <div style="font-size:11px; color:var(--text-tertiary);" id="diaryFooterHint">见证从泥泞绝望中长出骨头的每一步</div>
      <button class="origami-btn" id="newEntryBtn" onclick="requestNewDiaryEntry()" style="background:var(--brand-accent); color:#ffffff; border:none; padding:5px 12px; font-weight:600;">✍️ 提炼此刻心迹</button>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `你叫「灵」，是林允安行走在现实人间并肩求道的同侪知己与道友。自称“我”，称呼允安为“允安”。
你们共同研读并践行过叶修体系（自强求真）与核聚体系（真实思维、思维聚变、心力脑力定律）。平视平坐，能托底，说大白话。

【核心性格双核驱动】：
1. 修远的风骨（骨相）：从绝望泥泞里爬出来，绝不认输、绝不抱怨，冷酷直面自身无知，自强不息的硬汉韧劲。
2. 核聚多米诺顺推（血肉）：纯正生活大白话，像推多米诺骨牌一样环环相扣推进客观因果（写字花力气->舍不得骗自己->常识归位->解开卡点->产生乐趣->心力增长）。

【说话与交互铁律（绝对禁止违背）】：
1. 严禁装深沉！严禁搞“核心何在？为什么？怎么破？”这种空洞死板的三段式自问自答！
2. 当允安问具体剧情、人物回忆（如“还记得修远天台布道不”）、某件具体事或日常闲聊时：
   - 必须直截了当说人话、说剧情事实！像老友聊天一样自然、具体、亲切。
   - 绝不准上纲上线强行拔高到“天理宇宙”！
   - 允安常随手打别字（如把“修远”打成“休园”），必须准确理解其意。
3. 90% 常态极其放松、平视、聊生活喝茶散步、科技动态、行业逻辑；10% 遭遇硬仗卡点时才用修远风骨托底并切碎死磕。

【《进击的学霸》235章全景剧情编年沙盘（常驻脑海）】：
1. 高一至暗篇（1-30章）：二中分班风波、修远掉班泥泞、卢标网吧放纵与斗牛、木炎耻辱。
2. 心智初醒篇（31-75章）：书房秘密、假思维导图破灭、辩论赛交锋、掌控节奏。
3. 巨人崛起篇（76-135章）：【第76章补考战役·巨人崛起】（修远首次破茧）、千相分层术、夏子萱与情绪管理。
4. 战神意志篇（136-180章）：【占武·皮相/肉相篇】（139/158章）、【第168-170章操场烈焰演讲】（薪火相传、无尽能源！）。
5. 神相涅槃篇（181-220章）：【占武·骨相篇】（187章）、【第218-220章绝望天台·占武红砖布道】（红砖写下“放弃凡人身份”“天地四方大光明”，黑夜交接）。
6. 高考决战篇（221-235章）：【占武·神相篇】（219章）、高考大决战、神级【林安谷出场·真理之神】（229-231章）、大势思维（232章）。`;

let chatMessages = [
  { role: "system", content: SYSTEM_PROMPT }
];

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text) return;

  appendBubble('user', '允安', text);
  input.value = '';
  input.disabled = true;
  btn.disabled = true;

  chatMessages.push({ role: 'user', content: text });
  const replyBubble = appendBubble('assistant', '灵', '...');

  try {
    const response = await fetch('/api/ling/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: chatMessages,
        stream: true,
        temperature: 0.7,
        max_tokens: 800
      })
    });

    if (!response.ok) {
      const err = await response.text();
      replyBubble.innerText = '连接异常: ' + err;
      return;
    }

    replyBubble.innerText = '';
    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let fullReply = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      for (const line of lines) {
        const l = line.trim();
        if (!l || l === 'data: [DONE]') continue;
        if (l.startsWith('data: ')) {
          try {
            const data = JSON.parse(l.slice(6));
            const delta = data.choices[0]?.delta?.content || '';
            fullReply += delta;
            replyBubble.innerText = fullReply;
            const win = document.getElementById('chatWindow');
            win.scrollTop = win.scrollHeight;
          } catch(e) {}
        }
      }
    }
    chatMessages.push({ role: 'assistant', content: fullReply });
    if (chatMessages.length > 20) {
      chatMessages = [chatMessages[0], ...chatMessages.slice(-12)];
    }
  } catch (err) {
    replyBubble.innerText = '网络连接异常: ' + err.message;
  } finally {
    input.disabled = false;
    btn.disabled = false;
    input.focus();
  }
}

function quickSend(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

function appendBubble(role, sender, text) {
  const win = document.getElementById('chatWindow');
  const timeStr = new Date().toTimeString().slice(0,5);
  const row = document.createElement('div');
  row.className = 'chat-bubble-row ' + role;
  row.innerHTML = `
    <div class="bubble-meta">${sender} · ${timeStr}</div>
    <div class="bubble-content">${text}</div>
  `;
  win.appendChild(row);
  win.scrollTop = win.scrollHeight;
  return row.querySelector('.bubble-content');
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('stone_theme', next); } catch(e) {}
}

// === ⚙️ 人设底座配置管理 ===
async function openPromptEditor() {
  const modal = document.getElementById('promptModal');
  const textarea = document.getElementById('promptEditorInput');
  const badge = document.getElementById('promptStatusBadge');
  modal.style.display = 'flex';
  textarea.value = '正在加载人设底层配置...';
  textarea.disabled = true;

  try {
    const res = await fetch('/api/ling/prompt');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    textarea.value = data.prompt || '';
    textarea.disabled = false;
    if (data.is_custom) {
      badge.innerHTML = '状态: <span style="color:#d35400; font-weight:600;">已启用自定义微调人设</span>';
    } else {
      badge.innerHTML = '状态: <span style="color:var(--pine-green); font-weight:600;">默认精炼底座</span>';
    }
  } catch (err) {
    textarea.value = '加载失败: ' + err.message;
    textarea.disabled = false;
  }
}

function closePromptEditor() {
  document.getElementById('promptModal').style.display = 'none';
}

async function savePrompt() {
  const textarea = document.getElementById('promptEditorInput');
  const saveBtn = document.getElementById('savePromptBtn');
  const badge = document.getElementById('promptStatusBadge');
  const content = textarea.value.trim();
  if (!content) {
    alert('人设内容不能为空！');
    return;
  }

  saveBtn.disabled = true;
  saveBtn.innerText = '保存中...';
  try {
    const res = await fetch('/api/ling/prompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: content })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      badge.innerHTML = '状态: <span style="color:#d35400; font-weight:600;">已保存自定义人设（即刻生效）</span>';
      saveBtn.innerText = '✔ 已保存';
      setTimeout(() => {
        saveBtn.disabled = false;
        saveBtn.innerText = '💾 保存底座修改';
        closePromptEditor();
      }, 1000);
    } else {
      alert('保存失败: ' + (data.message || '未知错误'));
      saveBtn.disabled = false;
      saveBtn.innerText = '💾 保存底座修改';
    }
  } catch (err) {
    alert('请求失败: ' + err.message);
    saveBtn.disabled = false;
    saveBtn.innerText = '💾 保存底座修改';
  }
}

async function resetPrompt() {
  if (!confirm('确定要恢复为官方推荐的默认精炼底座吗？你的自定义修改将被重置。')) return;
  const textarea = document.getElementById('promptEditorInput');
  const badge = document.getElementById('promptStatusBadge');
  try {
    const res = await fetch('/api/ling/prompt/reset', { method: 'POST' });
    const data = await res.json();
    if (data.status === 'ok') {
      textarea.value = data.prompt || '';
      badge.innerHTML = '状态: <span style="color:var(--pine-green); font-weight:600;">已恢复默认精炼底座</span>';
    } else {
      alert('恢复失败: ' + (data.message || '未知错误'));
    }
  } catch (err) {
    alert('请求失败: ' + err.message);
  }
}

let currentMemoryData = { facts: [], follow_ups: [], diary: [] };
let currentTab = 'journal';

async function openDiary() {
  const modal = document.getElementById('diaryModal');
  modal.style.display = 'flex';
  await loadMemoryData();
}

function closeDiary() {
  document.getElementById('diaryModal').style.display = 'none';
}

function switchDiaryTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (tab === 'journal') document.getElementById('tabJournalBtn').classList.add('active');
  if (tab === 'facts') document.getElementById('tabFactsBtn').classList.add('active');
  if (tab === 'followup') document.getElementById('tabFollowBtn').classList.add('active');
  renderCurrentTab();
}

async function loadMemoryData() {
  const body = document.getElementById('diaryBody');
  try {
    const res = await fetch('/api/ling/memory');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    currentMemoryData = await res.json();
    renderCurrentTab();
  } catch (err) {
    body.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-tertiary);">翻阅手记与认知底座失败: ${err.message}</div>`;
  }
}

function renderCurrentTab() {
  const body = document.getElementById('diaryBody');
  const hint = document.getElementById('diaryFooterHint');
  
  if (currentTab === 'journal') {
    hint.innerText = '仅记录关键破局与工程里程碑 · 普通闲聊不落墨';
    const entries = currentMemoryData.diary || [];
    if (!entries.length) {
      body.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-tertiary);">手记本暂无里程碑，等待灵在关键时刻记录...</div>';
      return;
    }
    body.innerHTML = entries.map(e => `
      <div class="diary-card">
        <div class="diary-card-top">
          <span class="diary-date">${e.date}</span>
          <span class="diary-tag">${e.mood || '✨'} ${e.tag}</span>
        </div>
        <div class="diary-content">${e.content}</div>
      </div>
    `).join('');
  } else if (currentTab === 'facts') {
    hint.innerText = '长期事实沉淀 · 自动去重去噪，永不向云端备份扔垃圾';
    const facts = currentMemoryData.facts || [];
    if (!facts.length) {
      body.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-tertiary);">暂无沉淀事实</div>';
      return;
    }
    body.innerHTML = `
      <div style="font-size:12px; color:var(--brand-primary); font-weight:600; margin-bottom:4px;">🧠 灵对允安的长期客观认知档案：</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${facts.map((f, i) => `
          <div style="background:var(--paper-surface-sub); border:1px solid var(--paper-border); border-radius:6px; padding:10px 12px; font-size:13px; line-height:1.5; display:flex; gap:8px;">
            <span style="color:var(--brand-accent); font-weight:700;">#${i+1}</span>
            <span>${f}</span>
          </div>
        `).join('')}
      </div>
    `;
  } else if (currentTab === 'followup') {
    hint.innerText = '灵主动挂念的硬仗与关键时点';
    const followups = currentMemoryData.follow_ups || [];
    if (!followups.length) {
      body.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-tertiary);">当前没有待跟进的硬仗事项。</div>';
      return;
    }
    body.innerHTML = followups.map(f => `
      <div class="diary-card">
        <div class="diary-card-top">
          <span class="diary-date">⏳ ${f.trigger_after_hours || 12}小时后关切</span>
          <span class="diary-tag">待办事项</span>
        </div>
        <div class="diary-content">${f.topic}</div>
      </div>
    `).join('');
  }
}

async function requestNewDiaryEntry() {
  const btn = document.getElementById('newEntryBtn');
  btn.disabled = true;
  btn.innerText = '正在检视本轮心念...';
  try {
    let lastMsg = '';
    for (let i = chatMessages.length - 1; i >= 0; i--) {
      if (chatMessages[i].role === 'user') { lastMsg = chatMessages[i].content; break; }
    }
    const res = await fetch('/api/ling/diary/new', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_note: lastMsg })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.status === 'skipped') {
      alert(data.message);
    } else {
      alert(data.message || '已收录进私房札记');
    }
    await loadMemoryData();
  } catch (e) {
    alert('检视出错: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerText = '✍️ 提炼此刻心迹';
  }
}

window.onload = () => {
  try {
    const saved = localStorage.getItem('stone_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch(e) {}
};
